# Ruby version lives in .ruby-version so mise and ruby/setup-ruby (CI)
# read the same file. This setting is what makes mise read it at all --
# idiomatic version files are opt-in per tool and default to off.
[settings]
idiomatic_version_file_enable_tools = ["ruby"]

[tasks.build]
description = "Build the site into _site/"
# Match .github/workflows/pages.yml: footer.html branches on jekyll.environment,
# so a development build would check HTML that never deploys.
env = { JEKYLL_ENV = "production" }
run = "bundle exec jekyll build"

[tasks.check-links]
description = "Build the site and check every internal link, asset and anchor"
depends = ["build"]
run = "bundle exec ruby bin/check-links"

[tasks.serve]
description = "Serve the site locally with live rebuilds"
# Conductor gives each workspace its own port block, so parallel workspaces
# never collide. Outside Conductor, fall back to Jekyll's own default.
run = 'bundle exec jekyll serve --drafts --future --port "${CONDUCTOR_PORT:-4000}"'

[tasks.chart]
description = "Regenerate the merges-per-day chart in the autonomous agents post"
# Reads the pull request history from GitHub, so it needs gh logged in. Not a
# build step: the SVG is committed, and this only runs when the numbers should
# move. Pass --end to stop on a finished day, or the last bar is drawn as a day
# still in progress.
run = "bin/merges-chart"
