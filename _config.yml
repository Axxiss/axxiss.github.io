# Site settings
title: Alexis Mas
tagline: 'Infrastructure & platform engineering'
description: 'Alexis Mas — infrastructure and platform engineer in Valencia, Spain. Kubernetes on AWS, Terraform and Pulumi, observability, and developer tooling.'
url: 'https://alexismas.com'
baseurl: ''
google_analytics: UA-46113844-1

author:
  name: 'Alexis Mas'
  email: hello@alexismas.com
  github_username:  Axxiss
  linkedin_username: alexis-mas

collections:
  archive:
    output: true

defaults:
  -
    scope:
      path: ''
      type: 'posts'
    values:
        layout: 'post'

# Build settings
destination: _site
paginate: 10
paginate_path: "/blog/page:num/"
permalink: /blog/:year/:month/:day/:title/
markdown: kramdown
highlighter: rouge

kramdown:
  # use Github Flavored Markdown
  input: GFM
  # do not replace newlines by <br>s
  hard_wrap: false

gems: ['jekyll-paginate']
exclude: ['README.md', 'Gemfile', 'Gemfile.lock', 'screenshot.png']
