# Site settings
title: Alexis Mas
description: 'Turning coffee into software since 2008'
url: 'https://alexismas.com'
baseurl: ''
google_analytics: UA-46113844-1

author:
  name: 'Alexis Mas'
  email: hello@alexismas.com
  github_username:  Axxiss
  linkedin_username: alexis-mas

defaults:
  -
    scope:
      path: ''
      type: 'posts'
    values:
        layout: 'post'

# Build settings
# Pinned so local builds match CI and the previous GitHub Pages builder,
# both of which run in UTC. Without it a post dated 2014-10-17 21:20 -0200
# renders under a different day (and URL) on a machine east of UTC.
timezone: UTC
destination: _site
paginate: 10
paginate_path: "/blog/page:num/"
permalink: /blog/:year/:month/:day/:title/
markdown: kramdown
highlighter: rouge

kramdown:
  # use Github Flavored Markdown
  input: GFM
  # do not replace newlines by <br>s
  hard_wrap: false

plugins: ['jekyll-paginate']
exclude: ['README.md', 'Gemfile', 'Gemfile.lock', 'mise.toml', '.ruby-version', 'vendor', 'screenshot.png']
