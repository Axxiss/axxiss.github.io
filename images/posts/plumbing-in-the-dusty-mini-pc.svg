<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"
     role="img" aria-labelledby="title desc">
  <title id="title">Plumbing in the dusty mini-PC</title>
  <desc id="desc">A dusty mini-PC with three pipes running out of it, each ending in a
  paper tag: project-a.ts.net:6767, project-b.ts.net:6767, project-c.ts.net:6767. The
  port is the same on all three; only the hostname changes.</desc>

  <!-- Colours are literal values lifted from css/palette.css. Keep them in step
       with the navy, ochre, paper, muted, rule, syn-bg and syn-comment tokens. -->
  <defs>
    <linearGradient id="sky" gradientUnits="userSpaceOnUse"
                    x1="196.8" y1="-165.4" x2="1003.2" y2="795.4">
      <stop offset="0"    stop-color="#1a3f7d"/>
      <stop offset="0.55" stop-color="#12326b"/>
      <stop offset="1"    stop-color="#0a1c40"/>
    </linearGradient>
    <linearGradient id="desk" gradientUnits="userSpaceOnUse" x1="52" y1="0" x2="520" y2="0">
      <stop offset="0"    stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="1"    stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="lid">
      <polygon points="100,318 380,318 446,272 166,272"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#sky)"/>

  <!-- the surface it sits on -->
  <line x1="52" y1="438.5" x2="520" y2="438.5" stroke="url(#desk)" stroke-width="2"/>

  <!-- pipes, drawn before the box so the joints disappear behind it -->
  <g fill="none" stroke="#e0a800" stroke-width="7" stroke-linecap="round">
    <path d="M430 325 H555 Q595 325 595 285 V195 Q595 155 635 155 H744"/>
    <path d="M430 355 H570 Q595 355 595 342.5 Q595 330 620 330 H744"/>
    <path d="M430 385 H555 Q595 385 595 425 V465 Q595 505 635 505 H744"/>
  </g>

  <!-- the mini-PC -->
  <polygon points="380,318 446,272 446,392 380,438" fill="#0f1c33"/>
  <polygon points="100,318 380,318 446,272 166,272" fill="#1a2d4e"/>
  <rect x="100" y="318" width="280" height="120" fill="#14243f"/>
  <!-- dust on the lid, and one fingertip swipe back down to clean metal -->
  <g clip-path="url(#lid)">
    <polygon points="100,318 380,318 446,272 166,272" fill="#6d7381" fill-opacity=".25"/>
    <path d="M150 286 Q250 256 330 272 Q390 284 430 262" fill="none"
          stroke="#1a2d4e" stroke-width="13" stroke-linecap="round"/>
  </g>
  <!-- vents -->
  <g stroke="#0f1c33" stroke-width="3" stroke-linecap="round">
    <line x1="196" y1="376" x2="352" y2="376"/>
    <line x1="196" y1="388" x2="352" y2="388"/>
    <line x1="196" y1="400" x2="352" y2="400"/>
    <line x1="196" y1="412" x2="352" y2="412"/>
    <line x1="196" y1="424" x2="352" y2="424"/>
  </g>
  <!-- the only lit thing -->
  <circle cx="136" cy="412" r="5" fill="#e0a800"/>

  <!-- tags: same port, different name -->
  <g font-family="Menlo, Monaco, Consolas, monospace" font-size="24">
    <polygon points="770,117 1140,117 1140,193 770,193 744,155" fill="#fcfbf7" stroke="#e3e0d6"/>
    <text x="800" y="163" fill="#6d7381">project-a.ts.net<tspan fill="#12326b" font-weight="bold">:6767</tspan></text>

    <polygon points="770,292 1140,292 1140,368 770,368 744,330" fill="#fcfbf7" stroke="#e3e0d6"/>
    <text x="800" y="338" fill="#6d7381">project-b.ts.net<tspan fill="#12326b" font-weight="bold">:6767</tspan></text>

    <polygon points="770,467 1140,467 1140,543 770,543 744,505" fill="#fcfbf7" stroke="#e3e0d6"/>
    <text x="800" y="513" fill="#6d7381">project-c.ts.net<tspan fill="#12326b" font-weight="bold">:6767</tspan></text>
  </g>

  <line x1="62" y1="562.5" x2="102" y2="562.5" stroke="#e0a800" stroke-width="3"/>
  <text x="62" y="590" font-family="Menlo, Monaco, Consolas, monospace"
        font-size="17" fill="#808fa8">alexismas.com</text>
</svg>
